<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
        rel="stylesheet"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <header class="text-center mb-5">
            <h1 class="main-title">نظام إدارة النتائج</h1>
            <p class="subtitle">
                Student Results Management System
            </p>
        </header>

        <section class="main-card mb-4">

            <h2 class="section-title">إضافة طالب جديد</h2>

            <form id="studentForm">

                <div class="mb-3">
                    <label for="studentName" class="form-label">
                        اسم الطالب
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        class="form-control"
                        placeholder="اكتب اسم الطالب"
                    >
                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label for="grade1" class="form-label">
                            درجة المادة الأولى
                        </label>

                        <input
                            type="number"
                            id="grade1"
                            class="form-control"
                            placeholder="0 - 100"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="grade2" class="form-label">
                            درجة المادة الثانية
                        </label>

                        <input
                            type="number"
                            id="grade2"
                            class="form-control"
                            placeholder="0 - 100"
                        >
                    </div>

                    <div class="col-md-4 mb-3">
                        <label for="grade3" class="form-label">
                            درجة المادة الثالثة
                        </label>

                        <input
                            type="number"
                            id="grade3"
                            class="form-control"
                            placeholder="0 - 100"
                        >
                    </div>

                </div>

                <div class="mb-4">
                    <label for="attendance" class="form-label">
                        نسبة الحضور
                    </label>

                    <input
                        type="number"
                        id="attendance"
                        class="form-control"
                        placeholder="0 - 100"
                    >
                </div>

                <button type="submit" class="btn btn-add w-100">
                    إضافة طالب
                </button>

            </form>

        </section>

        <div id="errorMessage" class="alert alert-danger d-none mb-4">
        </div>

        <section class="main-card mb-4">

            <h2 class="section-title">قائمة الطلاب</h2>

            <div id="studentsDisplay">
                <p class="empty-message">
                    لم يتم إضافة أي طلاب حتى الآن.
                </p>
            </div>

        </section>

        <section class="main-card">

            <h2 class="section-title">لجنة الرأفة</h2>

            <p class="section-description">
                اضغط على الزر لمعالجة الطلاب الذين يتراوح متوسط درجاتهم
                بين 40 و49.
            </p>

            <button
                type="button"
                id="mercyButton"
                class="btn btn-mercy w-100 mb-4"
            >
                تفعيل لجنة الرأفة
            </button>

            <div id="mercyReport">
                <p class="empty-message">
                    لم يتم إنشاء التقرير النهائي بعد.
                </p>
            </div>

        </section>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="main.js"></script>

</body>
</html>
